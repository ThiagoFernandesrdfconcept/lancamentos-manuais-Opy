<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lançamentos Contábeis</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1C2938;
  --ink-soft:#3C4A5C;
  --bg:#F3F4F1;
  --panel:#FFFFFF;
  --row-hover:#FAFBFA;
  --line:#DCDFE2;
  --line-soft:#EAECEE;
  --accent:#2F6F5E;
  --accent-dark:#204B40;
  --accent-soft:#E4EEEB;
  --warn:#B8722C;
  --warn-soft:#F5E9DB;
  --danger:#B23B3B;
  --danger-soft:#F6E3E1;
  --muted:#6B7480;
  --sidebar:#16212E;
  --sidebar-soft:#8FA0AF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EAED;
    --ink-soft:#AEB8C2;
    --bg:#14181D;
    --panel:#1B2027;
    --row-hover:#20262E;
    --line:#2A3039;
    --line-soft:#232830;
    --accent:#3E9C81;
    --accent-dark:#7FD9BC;
    --accent-soft:#1E362F;
    --warn:#D69A5C;
    --warn-soft:#3A2C1B;
    --danger:#E08585;
    --danger-soft:#3A2020;
    --muted:#8B95A1;
    --sidebar:#0F141A;
    --sidebar-soft:#7C8A97;
  }
}
:root[data-theme="dark"]{
  --ink:#E7EAED;
  --ink-soft:#AEB8C2;
  --bg:#14181D;
  --panel:#1B2027;
  --row-hover:#20262E;
  --line:#2A3039;
  --line-soft:#232830;
  --accent:#3E9C81;
  --accent-dark:#7FD9BC;
  --accent-soft:#1E362F;
  --warn:#D69A5C;
  --warn-soft:#3A2C1B;
  --danger:#E08585;
  --danger-soft:#3A2020;
  --muted:#8B95A1;
  --sidebar:#0F141A;
  --sidebar-soft:#7C8A97;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3{
  font-family:'Source Serif 4',serif;
  font-weight:600;
  margin:0 0 4px 0;
  color:var(--ink);
}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px;
  min-width:230px;
  background:var(--sidebar);
  color:#EDF1F4;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
}
.sidebar .brand{
  font-family:'Source Serif 4',serif;
  font-size:19px;
  font-weight:600;
  color:#fff;
  margin-bottom:2px;
}
.sidebar .brand-sub{
  font-size:11.5px;
  color:var(--sidebar-soft);
  margin-bottom:28px;
}
.navbtn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  color:#CBD5DE;
  padding:10px 12px;
  border-radius:6px;
  font-size:13.5px;
  font-family:inherit;
  cursor:pointer;
  margin-bottom:2px;
  transition:background .12s;
}
.navbtn:hover{background:rgba(255,255,255,0.06);}
.navbtn.active{background:rgba(255,255,255,0.12);color:#fff;font-weight:600;}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;}
.navbtn.active .dot{opacity:1;}

.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);}
.sidebar-footer label{font-size:11px;color:var(--sidebar-soft);display:block;margin-bottom:5px;}
.sidebar-footer input, .sidebar-footer select{
  width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);
  color:#fff;border-radius:5px;padding:7px 8px;font-size:12.5px;font-family:inherit;
}
.sidebar-footer input::placeholder{color:#7F8C99;}

/* Main */
main{flex:1;padding:30px 40px;max-width:1180px;overflow-x:hidden;}
.page-header{margin-bottom:22px;}
.page-header p{color:var(--muted);margin:2px 0 0 0;font-size:13px;}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:22px;
  margin-bottom:20px;
}
.panel-title{font-size:13px;text-transform:none;color:var(--ink-soft);font-weight:600;margin-bottom:14px;letter-spacing:.2px;}

.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}

.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
  font-family:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
.field-account{position:relative;}
.account-selected{
  margin-top:6px;padding:7px 9px;background:var(--accent-soft);border-radius:5px;
  font-size:12px;color:var(--accent-dark);display:none;
}
.account-selected.show{display:block;}
.autocomplete-list{
  position:absolute;z-index:40;top:calc(100% + 3px);left:0;right:0;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  max-height:260px;overflow-y:auto;box-shadow:0 6px 18px rgba(20,30,40,0.12);display:none;
}
.autocomplete-list.show{display:block;}
.ac-item{padding:8px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line-soft);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.hl{background:var(--accent-soft);}
.ac-item .code{font-family:'IBM Plex Mono',monospace;color:var(--accent-dark);margin-right:8px;font-weight:600;}
.ac-empty{padding:10px;font-size:12px;color:var(--muted);}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--accent);color:#fff;border:none;border-radius:6px;
  padding:10px 18px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:background .12s;
}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn.secondary:hover{background:var(--line-soft);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger-soft);}
.btn.danger:hover{background:var(--danger-soft);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;margin-top:18px;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{
  text-align:left;font-weight:600;color:var(--ink-soft);
  border-bottom:1.5px solid var(--ink);padding:8px 8px;font-size:11.5px;
  white-space:nowrap;
}
tbody td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
tbody tr:hover{background:var(--row-hover);}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.tbl-scroll{overflow-x:auto;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.ok{background:var(--accent-soft);color:var(--accent-dark);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.muted{background:var(--line-soft);color:var(--muted);}

.lote-card{
  border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;
  cursor:pointer;background:var(--panel);transition:border-color .12s;
}
.lote-card:hover{border-color:var(--accent);}
.lote-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.lote-card .lote-num{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--ink);}
.lote-card .lote-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.lote-card .lote-stats{display:flex;gap:18px;margin-top:10px;font-size:12px;}
.lote-card .stat b{display:block;font-size:14.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink);}
.lote-card .stat span{color:var(--muted);}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--muted);
}
.empty-state h3{color:var(--ink-soft);margin-bottom:6px;}

.code-preview{
  background:#12181F;color:#C9D6DD;border-radius:8px;padding:16px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.8;
  max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all;
}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:7px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:100;
}
.toast.show{opacity:1;transform:translateY(0);}
.row-actions{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:78px;}
.row-actions .icon-btn{white-space:nowrap;}
.icon-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:12px;border-radius:4px;
}
.icon-btn:hover{background:var(--line-soft);color:var(--ink);}
.divider{height:1px;background:var(--line);margin:18px 0;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;} .grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
.char-count{font-size:11px;color:var(--muted);text-align:right;margin-top:3px;}
.pill-input{display:flex;gap:8px;align-items:center;}
.small-note{font-size:11.5px;color:var(--muted);margin-top:8px;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv b{font-family:'IBM Plex Mono',monospace;}

/* Company tabs */
.company-tabs{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;
  border-bottom:1px solid var(--line);padding-bottom:0;
}
.company-tab{
  background:transparent;border:none;border-bottom:2.5px solid transparent;
  color:var(--muted);padding:9px 4px;margin-right:18px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s;
}
.company-tab:hover{color:var(--ink-soft);}
.company-tab.active{color:var(--ink);border-bottom-color:var(--accent);}

.tipo-lanc{display:flex;gap:8px;margin-bottom:4px;}
.tipo-chip{
  flex:1;text-align:center;padding:9px 8px;border:1px solid var(--line);border-radius:6px;
  cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--panel);transition:all .12s;
}
.tipo-chip:hover{border-color:var(--accent);}
.tipo-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.field-account.locked input[type=text]{background:var(--accent-soft);color:var(--accent-dark);font-weight:600;cursor:not-allowed;}
.locked-tag{font-size:10.5px;color:var(--accent-dark);font-weight:700;letter-spacing:.3px;margin-left:6px;}
</style>
</head>
<body>
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar);">
  <div style="background:var(--panel);border-radius:12px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);">
    <div style="font-family:'Source Serif 4',serif;font-size:21px;font-weight:600;color:var(--ink);margin-bottom:2px;">Lançamentos</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:24px;">Contabilização manual · Sankhya</div>

      <label>E-mail corporativo</label>
      <input id="login_email" type="email" placeholder="voce@opyhealth.com.br">
    </div>
    <div class="field" style="margin-bottom:6px;">
      <label>Senha</label>
      <input id="login_senha" type="password" placeholder="••••••••">
    </div>
    <div id="loginErro" style="color:var(--danger);font-size:12.5px;min-height:18px;margin:6px 0 10px 0;"></div>
    <button class="btn" id="btnLogin" style="width:100%;justify-content:center;">Entrar</button>
    <div class="small-note" style="margin-top:14px;text-align:center;">Acesso restrito a e-mails corporativos cadastrados pelo administrador.</div>
  </div>
</div>
<div id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">Lançamentos</div>
    <div class="brand-sub">Contabilização manual · Sankhya</div>
    <button class="navbtn" data-tab="lancar"><span class="dot"></span>Novo lançamento</button>
    <button class="navbtn" data-tab="plano"><span class="dot"></span>Plano de Contas</button>

    <button class="navbtn" data-tab="lotes"><span class="dot"></span>Lotes &amp; conferência</button>
    <button class="navbtn" data-tab="liberacao"><span class="dot"></span>Liberação</button>
    <button class="navbtn" id="navExportar" data-tab="exportar"><span class="dot"></span>Exportar p/ Sankhya</button>
    <div class="sidebar-footer">
      <label for="meuNomeInput">Lançado por</label>
      <input id="meuNomeInput" type="text" placeholder="Seu nome" readonly style="cursor:not-allowed;opacity:.85;">
      <label for="meuSetorInput" style="margin-top:10px;">Setor <span style="color:var(--danger)">*</span></label>
      <input id="meuSetorInput" type="text" placeholder="Ex: Contabilidade">
      <label for="temaSelect" style="margin-top:10px;">Tema</label>
      <select id="temaSelect">
        <option value="auto">Automático</option>
        <option value="light">Claro</option>
        <option value="dark">Escuro</option>
      </select>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:var(--sidebar-soft);">
        <span id="loggedAsEmail"></span> · <a href="#" id="btnLogout" style="color:var(--sidebar-soft);text-decoration:underline;">sair</a>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

async function loadState(){
  try{
    const r = await window.storage.get('lancamentos', true);
    state.lancamentos = r ? JSON.parse(r.value) : [];
  }catch(e){ state.lancamentos = []; }
  try{
    const r = await window.storage.get('lote-counters', true);
    state.loteCounters = r ? JSON.parse(r.value) : {};
  }catch(e){ state.loteCounters = {}; }
  try{
    const r = await window.storage.get('modelos', true);
    state.modelos = r ? JSON.parse(r.value) : [];
  }catch(e){ state.modelos = []; }
  try{
    const r = await window.storage.get('contas-extras', true);
    state.contasExtras = r ? JSON.parse(r.value) : [];
  }catch(e){ state.contasExtras = []; }
  mergeContasExtras();
  try{
    const r = await window.storage.get('meu-nome', false);
    state.meuNome = r ? r.value : '';
  }catch(e){ state.meuNome = ''; }
  try{
    const r = await window.storage.get('meu-setor', false);
    state.meuSetor = r ? r.value : '';
  }catch(e){ state.meuSetor = ''; }
  try{
    const r = await window.storage.get('meu-tema', false);
    state.tema = r && r.value ? r.value : 'auto';
  }catch(e){ state.tema = 'auto'; }
  aplicarTema(state.tema);
  try{
    const r = await window.storage.get('ultima-empresa', false);
    if(r && EMPRESAS.includes(r.value)) state.empresa = r.value;
  }catch(e){}
}

function formatMesAno(dataStr){
  if(!dataStr) return '';
  const parts = dataStr.split('-'); // yyyy-mm-dd
  if(parts.length < 2) return '';
  return parts[1] + '/' + parts[0];
}
function aplicarTemplateHistorico(template, dataStr){
  if(!template) return template;
  const mesAno = formatMesAno(dataStr);
  if(!mesAno) return template;
  return template.split('{MM/AAAA}').join(mesAno);
}

// window.storage shim — everything else in the app keeps calling
// window.storage.get/set exactly like before; only this layer changed.
function storageDocRef(key, shared){
  if(shared) return db.collection('appdata').doc(key);
  const uid = fbAuth.currentUser ? fbAuth.currentUser.uid : 'anon';
  return db.collection('users').doc(uid).collection('settings').doc(key);
}
window.storage = {
  async get(key, shared){
    const snap = await storageDocRef(key, shared).get();
    if(!snap.exists) return null;
    return { key, value: snap.data().value, shared };
  },
  async set(key, value, shared){
    await storageDocRef(key, shared).set({ value });
    return { key, value, shared };
  },
  async delete(key, shared){
    await storageDocRef(key, shared).delete();
    return { key, deleted: true, shared };
  }
};

// ---------- Live sync across users (Firestore onSnapshot — tempo real de verdade) ----------
let __syncReady = false;
let __suppressSyncToast = false;
function updateSyncBaseline(){ __suppressSyncToast = true; }
function setupRealtimeSync(){
  db.collection('appdata').onSnapshot((querySnapshot) => {
    let changed = false;
    querySnapshot.forEach(doc => {
      const raw = doc.data() ? doc.data().value : undefined;
      let val;
      try{ val = raw ? JSON.parse(raw) : undefined; }catch(e){ val = undefined; }
      if(doc.id === 'lancamentos'){ state.lancamentos = val || []; changed = true; }
      else if(doc.id === 'lote-counters'){ state.loteCounters = val || {}; changed = true; }
      else if(doc.id === 'modelos'){ state.modelos = val || []; changed = true; }
      else if(doc.id === 'contas-extras'){ state.contasExtras = val || []; mergeContasExtras(); changed = true; }
    });
    if(!__syncReady){ __syncReady = true; return; }
    if(!changed) return;
    const isExternal = !__suppressSyncToast;
    __suppressSyncToast = false;
    applySyncToUI(isExternal);
  }, (err) => {
    showToast('Sincronização perdeu conexão — verifique sua internet.');
  });
}
function applySyncToUI(isExternal){
  const typing = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);

  if(state.tab === 'lancar'){
    // Never touch the form itself (débito/crédito/valor being typed, or a batch-fill in progress).
    if(!state.usingModeloId && !state.editingId && !state.revertendoId){
      const recentBox = document.getElementById('recentBox');
      const modelosBox = document.getElementById('modelosBox');
      if(recentBox) recentBox.innerHTML = renderRecentForCurrentLote();
      if(modelosBox) modelosBox.innerHTML = renderModelosList();
      if(isExternal) showToast('Atualizado — outro usuário lançou algo agora.');
    }
    return;
  }
  if(typing) return;
  render();
  if(isExternal) showToast('Atualizado — outro usuário fez uma alteração.');
}

function parseValorBR(str){
  if(typeof str === 'number') return str;
  if(!str) return NaN;
  let s = String(str).trim();
  s = s.replace(/\./g,'').replace(',', '.');
  return parseFloat(s);
}
function formatBRL(n){
  if(isNaN(n)) return '-';
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatValorArquivo(n){
  return n.toFixed(2).replace('.', ',');
}
function applyMoneyMask(el){
  if(!el || el.dataset.maskApplied) return;
  el.dataset.maskApplied = '1';
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g,'');
    if(!digits){ el.value = ''; return; }
    const n = parseInt(digits, 10) / 100;
    el.value = formatBRL(n);
    el.setSelectionRange(el.value.length, el.value.length);
  });
}
function revertLineageNote(e){

    parts += `<br><span style="color:var(--accent-dark);font-size:10.5px;">↩ revertido${rev ? ' em '+formatDateBR(rev.data) : ''}</span>`;

    parts += `<br><span style="color:var(--warn);font-size:10.5px;">↩ reversão de: ${orig ? escapeHtml(orig.historico) : 'lançamento original'}</span>`;

}
function formatDateTimeBR(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
}
function formatDateBR(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
}
function normalizeHistorico(h){
  h = (h || '').trim();
  if(!h) return h;
  if(!/^valor\s*ref\.?/i.test(h)) h = 'VALOR REF. ' + h;
  return h;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Autocomplete ----------
function setupAccountAutocomplete(inputId, listId, hiddenId, selectedBoxId, dataArr, isConta, groupSelectId){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  const hidden = document.getElementById(hiddenId);
  const selBox = document.getElementById(selectedBoxId);
  const groupSel = groupSelectId ? document.getElementById(groupSelectId) : null;
  let hl = -1, currentMatches = [];

  function groupVal(){ return groupSel ? groupSel.value : ''; }
  function filtered(q){
    const gv = groupVal();
    return dataArr.filter(m => {
      if(gv && !(isConta ? String(m.red) : m.codigo).startsWith(gv)) return false;
      return !q || m.search.includes(q);
    });
  }

  function render(matches){
    currentMatches = matches;
    hl = -1;
    if(matches.length === 0){
      list.innerHTML = '<div class="ac-empty">Nenhum resultado</div>';
      list.classList.add('show');
      return;
    }
    list.innerHTML = matches.slice(0,40).map((m,i) => {
      if(isConta){
        return `<div class="ac-item" data-i="${i}"><span class="code">${m.red}</span>${escapeHtml(m.desc)}</div>`;
      }else{
        return `<div class="ac-item" data-i="${i}"><span class="code">${escapeHtml(m.codigo)}</span>${escapeHtml(m.desc)}</div>`;
      }
    }).join('');
    list.classList.add('show');
  }
  function select(m){
    if(isConta){
      hidden.value = m.red;
      input.value = m.red + ' — ' + m.desc;
      selBox.textContent = m.full + '  ·  ' + m.desc;
    }else{
      hidden.value = m.codigo;
      input.value = m.codigo + ' — ' + m.desc;
      selBox.textContent = m.desc;
    }
    selBox.classList.add('show');
    list.classList.remove('show');
  }
  input.addEventListener('input', () => {
    hidden.value = '';
    selBox.classList.remove('show');
    const q = input.value.trim().toLowerCase();
    if(q.length === 0 && !groupVal()){ list.classList.remove('show'); return; }
    render(filtered(q));
  });
  input.addEventListener('focus', () => {
    if(!hidden.value){
      const q = input.value.trim().toLowerCase();
      if(q.length > 0 || groupVal()) render(filtered(q));
    }
  });
  input.addEventListener('keydown', (e) => {
    if(!list.classList.contains('show')) return;
    const items = list.querySelectorAll('.ac-item');
    if(e.key === 'ArrowDown'){ e.preventDefault(); hl = Math.min(hl+1, items.length-1); updateHl(items); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); hl = Math.max(hl-1, 0); updateHl(items); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(hl>=0 && currentMatches[hl]) select(currentMatches[hl]); }
    else if(e.key === 'Escape'){ list.classList.remove('show'); }
  });
  function updateHl(items){
    items.forEach(it => it.classList.remove('hl'));
    if(items[hl]){ items[hl].classList.add('hl'); items[hl].scrollIntoView({block:'nearest'}); }
  }
  list.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.ac-item');
    if(!item) return;
    const i = parseInt(item.dataset.i);
    select(currentMatches[i]);
  });
  document.addEventListener('click', (e) => {
    if(!input.contains(e.target) && !list.contains(e.target) && !(groupSel && groupSel.contains(e.target))) list.classList.remove('show');
  });
  if(groupSel){
    groupSel.addEventListener('change', () => {
      hidden.value = '';
      input.value = '';
      selBox.classList.remove('show');
      const gv = groupVal();
      if(gv){ setTimeout(() => { render(filtered('')); input.focus(); }, 0); }
      else{ list.classList.remove('show'); }
    });
  }
  return { setValue: (code) => {
    if(isConta){
      const m = CONTAS_BY_RED[code];
      if(m) select(m);
    }else{
      const m = CENTROS_BY_CODE[code];
      if(m) select(m);
    }
  }, clear: () => {
    input.value=''; hidden.value=''; selBox.classList.remove('show'); selBox.textContent='';
  }};
}

function getUltimoValorLinha(empresa, modeloId, linhaIdx, debito, credito, cr){
  let candidatos = state.lancamentos.filter(e =>
    e.empresa === empresa && e.modeloId === modeloId && e.modeloLinha === linhaIdx
  );
  if(candidatos.length === 0){
    candidatos = state.lancamentos.filter(e =>
      e.empresa === empresa && e.debito === debito && e.credito === credito && (e.cr || '') === (cr || '')
    );
  }
  if(candidatos.length === 0) return null;
  candidatos.sort((a,b) => {
    if(a.data !== b.data) return a.data < b.data ? 1 : -1;
    return (b.criadoEm||0) - (a.criadoEm||0);
  });
  return candidatos[0].valor;
}

function renderModelosList(){
  const modelos = state.modelos.filter(m => m.empresa === state.empresa);
  const nomesExistentes = new Set(modelos.map(m => m.nome));
  const padraoEmpresa = MODELOS_PADRAO_POR_EMPRESA[state.empresa] || [];
  const faltamPadrao = padraoEmpresa.some(mp => !nomesExistentes.has(mp.nome));
  const botaoPadrao = faltamPadrao ? `<div style="margin-bottom:12px;"><button class="btn secondary" id="btnCarregarModelosPadrao">+ Carregar modelos fixos de ${escapeHtml(state.empresa)}</button></div>` : '';
  if(modelos.length === 0) return botaoPadrao + '<p class="small-note">Nenhum modelo salvo ainda para esta empresa. Preencha Débito/Crédito/CR/Histórico e clique em "+ Adicionar linha ao modelo" — repita para várias linhas (ex: Provisão PPR com 4 CRs) e depois salve. Só o valor, data e documento ficam em aberto.</p>';
  return botaoPadrao + modelos.map(m => {
    return `<div style="padding:9px 0;border-bottom:1px solid var(--line-soft);">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;">
        <div style="font-size:13px;font-weight:600;color:var(--ink);">${escapeHtml(m.nome)} <span style="font-weight:400;color:var(--muted);font-size:11.5px;">(${m.linhas.length} linha${m.linhas.length===1?'':'s'})</span></div>

      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${m.linhas.slice(0,3).map(l=>escapeHtml(l.historico)).join(' · ')}${m.linhas.length>3?' ...':''}</div>

  }).join('');
}

function renderRecentForCurrentLote(){
  const loteInput = document.getElementById('f_lote');
  const lote = loteInput ? loteInput.value.trim() : '';
  if(!lote) return '<p class="small-note">Informe o lote para ver os lançamentos recentes.</p>';
  const entries = entriesForLote(lote);
  if(entries.length === 0) return '<p class="small-note">Nenhum lançamento neste lote ainda.</p>';
  const last = entries.slice(-6).reverse();
  const total = entries.reduce((s,e)=>s+e.valor,0);
  return `
    <div class="kv"><span>Lançamentos no lote</span><b>${entries.length}</b></div>
    <div class="kv"><span>Total do lote</span><b>R$ ${formatBRL(total)}</b></div>
    <div class="divider"></div>
    ${last.map(e => {
      const deb = CONTAS_BY_RED[e.debito];
      const cred = CONTAS_BY_RED[e.credito];
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line-soft);">

  const cards = lotes.map(l => {
    const entries = entriesForLote(l);
    const total = entries.reduce((s,e)=>s+e.valor,0);

        <div class="stat"><b>R$ ${formatBRL(total)}</b><span>total</span></div>
        <div class="stat"><b>${pend}</b><span>pendente${pend===1?'':'s'}</span></div>
      </div>
    </div>`;
  }).join('');

  const entries = entriesForLote(sel);
  const total = entries.reduce((s,e)=>s+e.valor,0);

          ${(e.exportado && podeDesbloquear()) ? `<button class="icon-btn" data-desbloquear="${e.id}" title="Desbloquear (só thiago.fernandes)" style="color:var(--danger);">Desbloquear</button>` : ''}

// ---------- Tab: Exportar ----------
function buildLine(entry, numlan){
  const deb = CONTAS_BY_RED[entry.debito];
  const cred = CONTAS_BY_RED[entry.credito];
  const codcon = deb ? deb.full.replace(/\./g,'') : '';
  const compar = cred ? cred.full.replace(/\./g,'') : '';
  const [y,m,d] = entry.data.split('-');
  const cencus = entry.cr ? entry.cr : '0';
  const fields = [
    entry.lote,
    numlan,
    codcon,
    compar,
    m,
    d,
    cencus,
    formatValorArquivo(entry.valor),
    '',
    entry.historico || '',
    'D',
    '',
    entry.nDoc,
    '',
    ''
  ];
  return fields.join('|');
}

// ---------- Events ----------
function afterRender(){
  document.getElementById('meuNomeInput').value = state.meuNome;
  document.getElementById('meuSetorInput').value = state.meuSetor;
  document.getElementById('temaSelect').value = state.tema;

  document.querySelectorAll('.company-tab').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.editingId = null;
      state.usingModeloId = null;
      state.filtroNat = ''; state.filtroCr = '';
      state.filtroCentroBrowse = '';
      await saveEmpresa(btn.dataset.empresa);
      render();
    });
  });

  if(state.tab === 'lancar'){
    const acDebito = setupAccountAutocomplete('ac_debito_input','ac_debito_list','ac_debito_hidden','ac_debito_sel', CONTAS, true);
    const acCredito = setupAccountAutocomplete('ac_credito_input','ac_credito_list','ac_credito_hidden','ac_credito_sel', CONTAS, true);
    const acCr = setupAccountAutocomplete('ac_cr_input','ac_cr_list','ac_cr_hidden','ac_cr_sel', centrosDaEmpresa(), false, 'filtro_cr_grupo');
    const acNatureza = setupNaturezaAutocomplete();
    const acFase2 = document.getElementById('ac_fase2_input') ? setupAccountAutocomplete('ac_fase2_input','ac_fase2_list','ac_fase2_hidden','ac_fase2_sel', CONTAS, true) : null;

    const editing = state.editingId ? state.lancamentos.find(l => l.id === state.editingId) : null;
    const revertOriginal = (!editing && state.revertendoId) ? state.lancamentos.find(l => l.id === state.revertendoId) : null;
    const pre = editing || (revertOriginal ? {
      debito: revertOriginal.credito, credito: revertOriginal.debito,
      cr: revertOriginal.cr, natureza: revertOriginal.natureza,
      tipoLanc: revertOriginal.tipoLanc === 'provisao' ? 'reversao' : (revertOriginal.tipoLanc === 'reversao' ? 'provisao' : 'direto'),
    } : null);
    let tipoLanc = (pre && pre.tipoLanc) || 'direto';

    if(pre){
      acDebito.setValue(pre.debito);
      acCredito.setValue(pre.credito);
      if(pre.cr) acCr.setValue(pre.cr);
    }

    function applyNaturezaLock(){
      const natCode = document.getElementById('ac_natureza_hidden').value;
      const nat = natCode ? NATUREZAS_BY_CODE[natCode] : null;
      const wrapDeb = document.getElementById('wrap_debito');
      const wrapCred = document.getElementById('wrap_credito');
      const debInput = document.getElementById('ac_debito_input');
      const credInput = document.getElementById('ac_credito_input');

      // A side that was auto-filled by natureza (locked) must be cleared before
      // re-applying — otherwise switching Provisão↔Reversão leaves the old value
      // sitting there instead of moving it to the other side.
      if(wrapDeb.classList.contains('locked')) acDebito.clear();
      if(wrapCred.classList.contains('locked')) acCredito.clear();
      { const cw = document.getElementById('creditoAutoWarn'); if(cw) cw.style.display = 'none'; }
      { const dw = document.getElementById('debitoAutoWarn'); if(dw) dw.style.display = 'none'; }

      wrapDeb.classList.remove('locked');
      wrapCred.classList.remove('locked');
      debInput.readOnly = false;
      credInput.readOnly = false;

      const fase2Wrap = document.getElementById('onmFase2Wrap');
      if(fase2Wrap){
        const showFase2 = (state.empresa === 'ONM HEALTH' && tipoLanc === 'provisao' && !!nat);
        fase2Wrap.style.display = showFase2 ? '' : 'none';
        if(!showFase2 && acFase2){
          acFase2.clear();
          const fase2InputHidden = document.getElementById('ac_fase2_input');
          if(fase2InputHidden) fase2InputHidden.readOnly = false;
        }
        if(showFase2){
          const natAcc = CONTAS_BY_RED[nat.red];
          const info = document.getElementById('onmFase2CreditoInfo');
          if(info) info.textContent = nat.red + (natAcc ? ' — ' + natAcc.desc : '');

          const autoRed = onmFase2AutoRed(nat.red);
          const fase2Input = document.getElementById('ac_fase2_input');
          const fase2Warn = document.getElementById('onmFase2Warn');
          const fase2Modo = document.getElementById('onmFase2Modo');
          if(autoRed && CONTAS_BY_RED[autoRed]){
            acFase2.setValue(autoRed);
            fase2Input.readOnly = true;
            if(fase2Warn) fase2Warn.style.display = 'none';
            if(fase2Modo) fase2Modo.textContent = '(preenchida automaticamente pela regra 4.1/4.2)';
          }else if(autoRed && !CONTAS_BY_RED[autoRed]){
            acFase2.clear();
            fase2Input.readOnly = false;
            if(fase2Warn){
              fase2Warn.style.display = '';
              fase2Warn.textContent = `Conta ${autoRed} não existe no plano de contas — selecione manualmente por enquanto.`;
            }
            if(fase2Modo) fase2Modo.textContent = '(escolha manualmente)';
          }else{
            fase2Input.readOnly = false;
            if(fase2Warn) fase2Warn.style.display = 'none';
            if(fase2Modo) fase2Modo.textContent = '(escolha manualmente)';
          }
        }
      }

      if(!nat || tipoLanc === 'direto') return;
      if(tipoLanc === 'provisao'){
        const debitoWarn = document.getElementById('debitoAutoWarn');
        let autoRed = null;
        if(state.empresa !== 'ONM HEALTH'){
          autoRed = onmFase2AutoRed(nat.red); // checa se a conta da natureza começa com 4.1 ou 4.2
        }
        if(autoRed && CONTAS_BY_RED[autoRed]){
          // Conta 4.1/4.2: Débito vira a conta fixa (1990/1092), não a conta da natureza. Crédito fica livre.
          acDebito.setValue(autoRed);
          wrapDeb.classList.add('locked');
          debInput.readOnly = true;
          if(debitoWarn) debitoWarn.style.display = 'none';
        }else if(autoRed && !CONTAS_BY_RED[autoRed]){
          // Regra bateria, mas a conta (1990) não existe no plano de contas ainda.
          wrapDeb.classList.remove('locked');
          debInput.readOnly = false;
          if(debitoWarn){
            debitoWarn.style.display = '';
            debitoWarn.textContent = `Conta ${autoRed} não existe no plano de contas — selecione manualmente por enquanto.`;
          }
        }else{
          // Regra da natureza (4.1/4.2) não se aplica — comportamento padrão: Débito = conta da natureza.
          acDebito.setValue(nat.red);
          wrapDeb.classList.add('locked');
          debInput.readOnly = true;
          if(debitoWarn) debitoWarn.style.display = 'none';
        }
      }else if(tipoLanc === 'reversao'){

        wrapCred.classList.add('locked');
        credInput.readOnly = true;
      }

          exportado: false, numlan: null, revertidoDe: null,

        });

        return;
      }
      const lote = document.getElementById('uso_lote').value.trim();
      const data = document.getElementById('uso_data').value;

      if(!lote){ showToast('Informe o lote.'); return; }

      const valorInputs = document.querySelectorAll('.uso_valor');
      const valores = [];

      const inversoes = {};
      document.querySelectorAll('.uso_inverter').forEach(chk => {
        inversoes[parseInt(chk.dataset.idx)] = chk.checked;
      });
      m.linhas.forEach((l, i) => {
        const inverter = !!inversoes[i];
        const debito = inverter ? l.credito : l.debito;

  }

  if(state.tab === 'exportar'){
    document.getElementById('f_loteExport').addEventListener('change', (e) => {
      state.selectedLoteView[state.empresa] = e.target.value;
      render();
    });
    const btnGerar = document.getElementById('btnGerarArquivo');
    if(btnGerar) btnGerar.addEventListener('click', async () => {
      if(!podeExportar()){ showToast('Seu usuário não tem permissão para exportar.'); return; }
      const sel = state.selectedLoteView[state.empresa] || distinctLotes()[0];
      const counterKey = state.empresa + '::' + sel;
      const startInput = document.getElementById('f_numlanStart');
      const start = parseInt(startInput.value) || 1;
      const pendentes = entriesForLote(sel).filter(e => !e.exportado && e.liberado);
      if(pendentes.length === 0) return;
      const lines = pendentes.map((e,i) => buildLine(e, start+i));
      const content = lines.join('\r\n') + '\r\n';
      const blob = new Blob([content], {type:'text/plain;charset=windows-1252'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'Lote'+sel+'.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);

      pendentes.forEach((e,i) => {
        const idx = state.lancamentos.findIndex(l => l.id === e.id);
        state.lancamentos[idx].exportado = true;
        state.lancamentos[idx].numlan = start + i;
        state.lancamentos[idx].exportadoEm = Date.now();
      });
      state.loteCounters[counterKey] = { proximo: start + pendentes.length };
      await saveLancamentos();
      await saveCounters();
      showToast('Arquivo gerado e lançamentos marcados como exportados.');
      render();
    });
    const btnCopiar = document.getElementById('btnCopiarArquivo');
    if(btnCopiar) btnCopiar.addEventListener('click', () => {
      const box = document.getElementById('previewBox');
      navigator.clipboard.writeText(box.textContent).then(() => showToast('Texto copiado.'));
    });

    const btnRegerar = document.getElementById('btnRegerarArquivo');
    if(btnRegerar) btnRegerar.addEventListener('click', () => {
      if(!podeExportar()){ showToast('Seu usuário não tem permissão para exportar.'); return; }
      const sel = state.selectedLoteView[state.empresa] || distinctLotes()[0];
      const jaExportados = entriesForLote(sel).filter(e => e.exportado).sort((a,b) => (a.numlan||0) - (b.numlan||0));
      if(jaExportados.length === 0) return;
      const lines = jaExportados.map(e => buildLine(e, e.numlan));
      const content = lines.join('\r\n') + '\r\n';
      const blob = new Blob([content], {type:'text/plain;charset=windows-1252'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'Lote'+sel+'.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Arquivo gerado novamente — mesmos NUMLAN de antes.');
    });
  }
}

document.querySelectorAll('.navbtn').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});
document.getElementById('meuSetorInput').addEventListener('change', (e) => saveSetor(e.target.value));
document.getElementById('temaSelect').addEventListener('change', (e) => saveTema(e.target.value));
document.getElementById('meuSetorInput').addEventListener('input', (e) => {
  if(e.target.value.trim()) e.target.style.borderColor = '';
});

const PERMISSOES = {
  liberar: ['thiago.fernandes@rdfconcept.com.br', 'cleoson.pena@opyhealth.com.br'],
  revogarLiberacao: ['thiago.fernandes@rdfconcept.com.br'],
  exportar: ['thiago.fernandes@rdfconcept.com.br', 'ana.bezerra@rdfconcept.com.br'],
  desbloquear: ['thiago.fernandes@rdfconcept.com.br']
};
function meuEmailLogado(){ return (fbAuth.currentUser && fbAuth.currentUser.email) ? fbAuth.currentUser.email.toLowerCase() : ''; }
function podeLiberar(){ return PERMISSOES.liberar.includes(meuEmailLogado()); }
function podeRevogarLiberacao(){ return PERMISSOES.revogarLiberacao.includes(meuEmailLogado()); }
function podeExportar(){ return PERMISSOES.exportar.includes(meuEmailLogado()); }
function podeDesbloquear(){ return PERMISSOES.desbloquear.includes(meuEmailLogado()); }
function nomeDoEmailLogado(){
  if(!fbAuth.currentUser || !fbAuth.currentUser.email) return '';
  const local = fbAuth.currentUser.email.split('@')[0];
  return local.split(/[._-]/).filter(Boolean).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
}
async function startApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('loggedAsEmail').textContent = fbAuth.currentUser ? fbAuth.currentUser.email : '';
  document.getElementById('navExportar').style.display = podeExportar() ? '' : 'none';
  await loadState();
  state.meuNome = nomeDoEmailLogado();
  setTab('lancar');
  setupRealtimeSync();
}

document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('login_email').value.trim();
  const senha = document.getElementById('login_senha').value;
  const erroBox = document.getElementById('loginErro');
  erroBox.textContent = '';
  if(!email || !senha){ erroBox.textContent = 'Preencha e-mail e senha.'; return; }
  try{
    await fbAuth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
      erroBox.textContent = 'E-mail ou senha incorretos.';
    }else if(e.code === 'auth/too-many-requests'){
      erroBox.textContent = 'Muitas tentativas — aguarde um pouco e tente de novo.';
    }else{
      erroBox.textContent = 'Não foi possível entrar. Tente novamente.';
    }
  }
});
document.getElementById('login_senha').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('btnLogin').click();
});
document.getElementById('btnLogout').addEventListener('click', async (e) => {
  e.preventDefault();
  await fbAuth.signOut();
});

fbAuth.onAuthStateChanged((user) => {
  if(user){
    startApp();
  }else{
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('login_email').value = '';
    document.getElementById('login_senha').value = '';
  }
});
</script>
